name: Build owned Agent release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
      - run: go test -mod=readonly ./...
      - run: sh -n scripts/install.sh
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, linux/386, linux/arm, linux/mips, linux/mipsle, linux/riscv64, linux/s390x, linux/loong64, darwin/amd64, darwin/arm64, windows/amd64, windows/386, windows/arm64, freebsd/amd64, freebsd/386, freebsd/arm, freebsd/arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: false
      - name: Build and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" CGO_ENABLED=0 GOMIPS=softfloat
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then version=0.0.0; fi
          binary=nezha-agent
          if [[ "$GOOS" == windows ]]; then binary=nezha-agent.exe; fi
          mkdir -p out
          go build -mod=readonly -trimpath -ldflags "-s -w -X github.com/nezhahq/agent/pkg/monitor.Version=$version -X main.arch=$GOARCH" -o "out/$binary" ./cmd/agent
          cd out
          archive="nezha-agent_${GOOS}_${GOARCH}.zip"
          zip "$archive" "$binary"
          sha256sum "$archive" | cut -d ' ' -f1 > "$archive.sha256"
          echo "asset=nezha-agent_${GOOS}_${GOARCH}" >> "$GITHUB_OUTPUT"
        id: build
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.asset }}
          path: |
            out/*.zip
            out/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Combined checksum list
        run: cd assets && sha256sum *.zip > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: assets/*
          body: |
            Self-owned Agent release for shini74744/nezha.
            Based on upstream v2.3.5; automatic and forced upgrades only use shini74744/agent.
            Region-based upstream mirrors are disabled. Installers preserve configuration and UUID and verify SHA256.
            Existing installed agents are not migrated automatically.
